<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="price">
        <form action="">
            <input type="text" name="amount" placeholder="0.00 $" class="amount" id="amount"/>
            <label for="amount" class="usd-label">USD</label>
        </form>
        <div class="egp">Price In EGP <span></span></div>
        <div class="sar">Price In SAR <span></span></div>
        <div class="aed">Price In AED <span></span></div>
        <button class="conv-button">Convert</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
